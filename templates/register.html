<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | ExpenseFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="auth-card">
        <div class="brand">Expense<span>Flow</span></div>
        <h1>Create your account</h1>
        <p class="muted">Start tracking your money today.</p>

        {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="notice">{{ message }}</div>
        {% endfor %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label>Your name</label>
            <input type="text" name="username" maxlength="50"
                   autocomplete="name" required>

            <label>Email address</label>
            <input type="email" name="email" maxlength="255"
                   autocomplete="email" required>

            <label>Password (at least 12 characters)</label>
            <input type="password" name="password" minlength="12"
                   maxlength="128" autocomplete="new-password" required>

            <button type="submit">Create account</button>
        </form>

        <p class="muted center">
            Already registered?
            <a href="{{ url_for('login') }}">Log in</a>
        </p>
    </main>
</body>
</html>
